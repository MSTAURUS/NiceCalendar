name: Build Debian package

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac pkg-config gettext dpkg-dev \
            libgtk-3-dev \
            libxfce4panel-2.0-dev \
            libxfce4util-dev \
            libxfconf-0-dev

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Package contents
        run: dpkg-deb --contents dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicecalendar-deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nicecalendar-deb-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
