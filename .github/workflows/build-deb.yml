name: Build Debian package

on:
  push:
    branches:
      - master
      - action
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v1.4.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac pkg-config gettext dpkg-dev \
            libgtk-3-dev \
            libxfce4panel-2.0-dev \
            libxfce4util-dev \
            libxfconf-0-dev

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Package contents
        run: dpkg-deb --contents dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicecalendar-deb-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh needs a git checkout to resolve the remote repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nicecalendar-deb-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb \
            --title "$TAG" --generate-notes \
            || gh release upload "$TAG" dist/*.deb --clobber
